name: Czystość repozytorium

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bez plików lokalnych i roboczych dokumentów
        run: python3 .github/check_repository_files.py
